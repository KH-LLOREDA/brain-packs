# Perfil SAP sobre el pool que instala desktop-windows. No declara conexión:
# la URL y el token del hipervisor viven en ese pack. Este archivo solo dice
# qué plantilla clonar y en qué puerto escucha el MCP de scripting.
slug: sap-gui-win
kind: proxmox-profile
profile: sap
name: "Perfil SAP GUI"
description: >-
  VMs Windows con SAP GUI y el MCP de scripting, una por usuario con sesión SAP
  aislada. Se clonan de la imagen dorada de SAP y se reciclan al snapshot clean.

template:
  # VMID de la imagen dorada de SAP: distinto en cada instalación, nunca en el pack.
  id_env: PROXMOX_WIN_TEMPLATE_ID
  storage_env: PROXMOX_VM_STORAGE
  target_node_env: PROXMOX_VM_TARGET_NODE
  # Al soltar la VM se revierte a este snapshot. Debe existir en la plantilla.
  snapshot: clean
  full_clone: false

pool:
  prefix: sap-win-
  warm: 1
  min: 1
  max: 3
  idle_minutes: 30
  max_session_minutes: 0
  destroy_on_release: false

guest:
  mcp_port: 3001
  vnc_port: 6080
