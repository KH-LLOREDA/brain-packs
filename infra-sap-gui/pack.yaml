id: infra-sap-gui
name: "Infra: SAP GUI (Windows sobre Proxmox)"
version: 1.1.0
description: >-
  Aporta la capacidad de OPERAR SAP: transacciones, pantallas y formularios de
  SAP GUI for Windows, conducidos por scripting (no por píxeles) desde el
  subagente sap_s4_operator.

  No abre el hipervisor. Depende de desktop-windows, que es el dueño del pool
  Proxmox. Este pack solo añade el perfil sap: otra plantilla (Windows + SAP GUI
  + MCP de scripting en el puerto 3001, prefijo sap-win-), una VM por usuario,
  reciclada al snapshot clean. El id de esa plantilla es PROXMOX_WIN_TEMPLATE_ID
  y se completa en Configuración › Sandbox, en los campos planos del pool.

  El pack NO fabrica la plantilla. La base Windows la documenta desktop-windows;
  aquí la skill sap_gui_golden_image añade SAP GUI, el scripting y el MCP, y
  deja la imagen lista para sysprep.

  Sustituye al subagente sap_s4_operator que vivía en el core de Brain: quien
  no tenga SAP deja de arrastrar un agente que no puede usar.
requires:
  - id: desktop-windows
    version: ">=2.0.0"
visual_apps:
  - kind: sap
    label: SAP GUI
    icon: table_chart
