id: office-mail
name: "Office: Mail Viewer"
version: 0.2.0
description: >-
  Visor de correo y buzón embebible (handlers email y mailbox). Runtime
  mail-viewer: parsea RFC822, sanitiza HTML, agrupa mensajes en carpetas
  (recibidos, borradores, enviados) y los pinta en un iframe aislado. No es un
  servidor IMAP/SMTP ni sustituye a Graph; office-m365 sigue siendo el conector
  365 y el transporte de envío.

  Las tools mail_viewer_* salen de la conexión OpenAPI del servicio.
  Imagen registry.khlloreda.es/mail-viewer:0.1.2.
requires: []
requires_brain: ">=3.1.0"
