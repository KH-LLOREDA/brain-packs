# Capability del pack office-m365. Las tools m365_* / user_tasks_* viven en el
# core de Brain; aquí se agrupan como capacidad cargable + sus skills de dominio.
- id: m365_productivity
  description: >-
    Microsoft 365 / Office 365: correo (Outlook), calendario y agenda, OneDrive,
    Teams, directorio Azure AD y tareas programadas. Usar para 'mi agenda del
    día', leer/enviar correos, eventos de calendario, configurar el 'Fuera de la
    oficina' / respuestas automáticas de Outlook, buscar archivos en OneDrive,
    mensajes de Teams o usuarios del directorio.
  category: office
  auto_load: false
  skills: [m365_productivity, calendar_teams, email_management]
