id: infra-vaultwarden
name: "Infra: Vaultwarden"
version: 1.2.0
description: >-
  Despliega proxy-vaultwarden como servicio del entorno y cablea su conexión
  OpenAPI con la URL que devuelve el despliegue (sin hostname fijo). Añade la
  capability y la skill para el agente basis. La cuenta de Bitwarden no es del
  entorno: el pack registra el tipo de conexión personal vaultwarden y cada
  usuario la rellena en Mis conexiones (URL, API key y contraseña maestra).
requires: []
