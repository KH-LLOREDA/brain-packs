  - proxy-vaultwarden_vw_unlock
  - proxy-vaultwarden_vw_lock
  - proxy-vaultwarden_vw_list_items
  - proxy-vaultwarden_vw_get_item
  - proxy-vaultwarden_vw_issue_handle
  - proxy-vaultwarden_vw_resolve
  - proxy-vaultwarden_vw_inject
