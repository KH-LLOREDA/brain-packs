id: vaultwarden
description: "Gestión de credenciales vía proxy-vaultwarden: estado/unlock, listado de ítems y handles opacos (issue/resolve/inject) para no exponer secretos en claro."
category: infra
auto_load: false
skills: [vaultwarden_ops]
# operationId del OpenAPI del proxy, con prefijo del slug de la conexión.
