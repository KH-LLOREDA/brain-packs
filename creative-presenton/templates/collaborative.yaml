id: slides.collaborative
name: Presentación colaborativa
description: >-
  Editor Presenton embebido. Trabajáis los dos sobre el mismo deck:
  el agente genera e itera; tú pintas en el iframe.
category: slides
outcome: artifact
panel_id: slides
handler: presenton
autonomy: collaborate
capabilities: [presentation_presenton]
seed_prompt: >-
  Contrato: PRESENTACIÓN COLABORATIVA (autonomía media, handler presenton).
  Carga la capability presentation_presenton. Crea el deck UNA sola vez con
  presenton_create_presentation: se abre el editor en el esquema y yo elijo
  plantilla, reviso el outline y genero. No relances la creación si ya hay
  presentation_id: los retoques van con las tools presenton_deck_*. No uses
  slides_begin/slides_add/slides_finalize ni OnlyOffice. Pregúntame audiencia,
  número de slides y tono, y crea el deck.
payload:
  tool: presenton_create_presentation
  handler: presenton
  autonomy: collaborate
tags: [Autonomía media]
preview: slideshow
sort_order: 20
