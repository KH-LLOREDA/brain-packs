# El asistente carga esta capability y opera en el mismo hilo.
# Las tools mcp_windows_* no van en `tools`: solo existen cuando Windows-MCP
# está conectado, y load_capability abre esa sesión y las adjunta.
- id: windows_desktop
  description: >-
    Escritorio Windows (abrir apps, rellenar formularios, leer lo que hay en
    pantalla) vía Windows-MCP. En un hilo que ya es ese escritorio, carga
    load_capability("windows_desktop") y llama tú a Snapshot, Click y App.
    windows_operator solo para un recado suelto desde otro asunto. No sirve
    para SAP GUI: eso es sap_s4_operator.
  category: infra
  auto_load: false
  skills: [windows_desktop]
  tools: []
  examples: >-
    CONTRATO — ESCRITORIO WINDOWS:
    1) Si el hilo ya es actuar en el PC Windows, llama
       load_capability("windows_desktop") y usa tú Snapshot, Click, App,
       Screenshot y DisplayInventory. No pases cada paso a otro agente:
       pierde la captura y el encargo.
    2) windows_operator solo cuando Windows es un recado suelto dentro de
       otro asunto: delegate(agent="windows_operator", task="<brief completo>").
       NUNCA escribas que has delegado sin esa tool call.
    3) Snapshot primero. Click sobre el id si el control aparece. Si no
       aparece, DisplayInventory una vez, Screenshot de la ventana y un
       Click en la rejilla de esa foto. Si la pantalla no cambia, un ajuste
       y para.
    4) SAP GUI no es este pack. Una transacción SAP va a sap_s4_operator,
       si ese pack está instalado.
    5) Resume al usuario el resultado, no la lista de clics.

- id: windows_mcp_setup
